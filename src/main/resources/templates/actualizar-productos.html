<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Actualizar Pan | Panadería Cookie and Bread</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
    <link rel="stylesheet" href="/plugins/fontawesome-free/css/all.min.css">
    <link rel="stylesheet" href="/dist/css/adminlte.min.css">

    <style>
        .main-sidebar { background-color: #4b3621 !important; }
        .nav-link.active { background-color: #d2691e !important; }
        .brand-link { border-bottom: 1px solid #5d4037 !important; }
    </style>
</head>
<body class="hold-transition sidebar-mini">
<div class="wrapper">

    <!-- Navbar -->
    <nav class="main-header navbar navbar-expand navbar-white navbar-light">
        <ul class="navbar-nav">
            <li class="nav-item">
                <a class="nav-link" data-widget="pushmenu" href="#" role="button"><i class="fas fa-bars"></i></a>
            </li>
        </ul>
    </nav>


    <div class="content-wrapper">
        <section class="content-header">
            <div class="container-fluid">
                <h1>Editar Información del Producto</h1>
            </div>
        </section>

        <section class="content">
            <div class="container-fluid">
                <div class="row">
                    <div class="col-md-8 offset-md-2">
                        <div class="card card-info card-outline">
                            <div class="card-header">
                                <h3 class="card-title"><i class="fas fa-sync-alt mr-1"></i> Modificar Pan</h3>
                            </div>

                            <!-- Formulario -->
                            <form th:action="@{/productos/guardar}" th:object="${productos}" method="post">

                                <!-- CRUCIAL: Campo oculto para el ID -->
                                <input type="hidden" th:field="*{id_productos}">

                                <div class="card-body">
                                    <div class="form-group">
                                        <label for="nombre">Nombre del Pan</label>
                                        <input type="text" th:field="*{nombre}" class="form-control" id="nombre" required>
                                    </div>

                                    <div class="form-group">
                                        <label for="precio">Precio ($)</label>
                                        <div class="input-group">
                                            <div class="input-group-prepend">
                                                <span class="input-group-text"><i class="fas fa-dollar-sign"></i></span>
                                            </div>
                                            <input type="number" step="0.01" th:field="*{precio}" class="form-control" id="precio" required>
                                        </div>
                                    </div>

                                    <div class="form-group">
                                        <label for="descripcion">Descripción</label>
                                        <textarea th:field="*{descripcion}" class="form-control" id="descripcion" rows="3"></textarea>
                                    </div>
                                </div>

                                <div class="card-footer">
                                    <button type="submit" class="btn btn-info">
                                        <i class="fas fa-check-circle mr-1"></i> Actualizar Cambios
                                    </button>
                                    <a th:href="@{/productos}" class="btn btn-default float-right">
                                        Volver al Listado
                                    </a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <!-- Contenido Principal -->
    <!-- Sidebar -->
    <aside class="main-sidebar sidebar-dark-primary elevation-4">
        <a th:href="@{/auth/menu}" class="brand-link">
            <i class="fas fa-bread-slice ml-3 mr-2" style="color: #f4a460;"></i>
            <span class="brand-text font-weight-light"><b>Panadería</b> Sistema</span>
        </a>
        <div class="sidebar">
            <div class="user-panel mt-3 pb-3 mb-3 d-flex">
                <div class="image d-flex align-items-center justify-content-center ml-2">
                    <i class="fas fa-user-circle fa-2x text-light"></i>
                </div>
                <div class="info">
                    <a href="#" class="d-block ml-2">Hola, <b th:text="${usuario.nombre}">Invitado</b></a>
                </div>
            </div>
            <nav class="mt-2">
                <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu">
                    <li class="nav-item"><a th:href="@{/auth/menu}" class="nav-link"><i class="nav-icon fas fa-tachometer-alt"></i><p>Panel Principal</p></a></li>
                    <li class="nav-item"><a th:href="@{/productos}" class="nav-link active"><i class="nav-icon fas fa-box-open"></i><p>Inventario de Panes</p></a></li>
                    <li class="nav-item"><a th:href="@{/ventas}" class="nav-link "><i class="nav-icon fas fa-shopping-basket"></i><p>Registro de Ventas</p></a></li>
                </ul>
            </nav>
        </div>
    </aside>

    <footer class="main-footer">
        <strong>Panadería Cookie and Breas &copy; 2026.</strong>
    </footer>
</div>

<script src="/plugins/jquery/jquery.min.js"></script>
<script src="/plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/dist/js/adminlte.min.js"></script>
</body>
</html>
